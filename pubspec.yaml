name: sushastho_ai
description: "বাংলাদেশি ব্যবহারকারীদের জন্য AI-চালিত স্বাস্থ্য ও পুষ্টি অ্যাপ।"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^5.6.12
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.7.0
  firebase_core: ^3.15.2
  flutter_local_notifications: ^19.4.2
  flutter_riverpod: ^3.3.1
  http: ^1.5.0
  image_picker: ^1.2.2
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  intl: ^0.20.2
  flutter_svg: ^2.2.4
  health: ^13.3.1
  lottie: ^3.3.3
  connectivity_plus: ^6.1.5
  pedometer: ^4.1.1
  permission_handler: ^11.4.0
  share_plus: ^12.0.0
  speech_to_text: ^7.3.0
  timezone: ^0.10.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
