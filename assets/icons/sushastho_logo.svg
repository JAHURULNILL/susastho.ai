<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D3D26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A5C38;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#52B788;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A651;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34C768;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00A651;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00A651" flood-opacity="0.35"/>
    </filter>
    <clipPath id="roundedSquare">
      <rect x="20" y="20" width="360" height="360" rx="88" ry="88"/>
    </clipPath>
  </defs>

  <rect x="20" y="20" width="360" height="360" rx="88" ry="88" fill="url(#bgGrad)"/>
  <circle cx="320" cy="80" r="120" fill="white" opacity="0.03"/>
  <circle cx="80" cy="320" r="100" fill="white" opacity="0.03"/>
  <circle cx="200" cy="185" r="105" fill="none" stroke="#34C768" stroke-width="1.5" opacity="0.25"/>
  <circle cx="200" cy="185" r="90" fill="none" stroke="#34C768" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="185" r="78" fill="#0A2E1A" opacity="0.6"/>

  <polyline
    points="128,185 148,185 158,158 170,212 182,172 192,198 204,185 224,185 234,160 246,210 258,185 272,185"
    fill="none"
    stroke="#34C768"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
    opacity="0.9"
  />

  <g transform="translate(200, 108)" filter="url(#softShadow)">
    <path
      d="M0,-38 C18,-28 32,-10 28,8 C24,26 12,36 0,38 C-12,36 -24,26 -28,8 C-32,-10 -18,-28 0,-38 Z"
      fill="url(#leafGrad)"
      opacity="0.95"
    />
    <line x1="0" y1="-30" x2="0" y2="30" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="-10" x2="14" y2="4" stroke="white" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="6" x2="-13" y2="18" stroke="white" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="-10" x2="-12" y2="2" stroke="white" stroke-width="1" opacity="0.25"/>
  </g>

  <circle cx="152" cy="132" r="3" fill="#52B788" opacity="0.6"/>
  <circle cx="248" cy="142" r="2" fill="#52B788" opacity="0.4"/>
  <circle cx="260" cy="230" r="2.5" fill="#34C768" opacity="0.5"/>
  <circle cx="140" cy="238" r="2" fill="#34C768" opacity="0.4"/>

  <text
    x="200"
    y="296"
    text-anchor="middle"
    font-family="'Noto Sans Bengali', 'Hind Siliguri', Arial, sans-serif"
    font-size="34"
    font-weight="800"
    fill="white"
    letter-spacing="1"
  >সুস্বাস্থ্য</text>

  <text
    x="200"
    y="328"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18"
    font-weight="400"
    fill="#52B788"
    letter-spacing="4"
    opacity="0.85"
  >.ai</text>

  <line x1="160" y1="340" x2="240" y2="340" stroke="#34C768" stroke-width="1" opacity="0.3"/>
</svg>
